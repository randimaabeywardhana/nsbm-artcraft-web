<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Center | NSBM ArtCraft</title>
  <link rel="stylesheet" href="assets/css/material.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Dynamic Application Header -->
  <header id="app-header"></header>

  <div style="background: var(--nsbm-blue); color: #fff; padding: 40px 0 30px; border-bottom: 3px solid var(--nsbm-green);">
    <div class="container">
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2.1rem; font-weight: 800;">Notifications & Activity Center</h1>
          <p style="color: #CBD5E1; font-size: 0.95rem; margin-top: 4px;">Real-time alerts for artwork approvals, community likes, comments, and exhibition updates</p>
        </div>
        <button class="btn btn-outline btn-sm" style="color: #fff; border-color: #fff;" onclick="markAllRead()">
          ✓ Mark All as Read
        </button>
      </div>
    </div>
  </div>

  <main class="container" style="padding: 40px 20px; max-width: 860px;">
    <div class="card" style="box-shadow: var(--shadow-sm); overflow: hidden;">
      <div id="notifications-container">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading notifications...</div>
      </div>
    </div>
  </main>

  <!-- Dynamic Application Footer -->
  <div id="app-footer"></div>

  <!-- Scripts -->
  <script src="assets/js/app.js"></script>
  <script>
    async function loadNotifications() {
      const container = document.getElementById('notifications-container');
      try {
        const res = await fetch('api/notifications.php?action=list&limit=50');
        const data = await res.json();
        if (data.status === 'success') {
          const list = data.data.notifications || [];
          renderNotifications(list, container);
        } else {
          container.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--color-danger);">${data.message}</div>`;
        }
      } catch (e) {
        container.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--color-danger);">Failed to load notifications. Please login.</div>`;
      }
    }

    function renderNotifications(list, container) {
      if (list.length === 0) {
        container.innerHTML = `
          <div style="padding: 60px 20px; text-align: center; color: var(--text-muted);">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">🔔</div>
            <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--nsbm-blue);">No notifications yet</h3>
            <p style="font-size: 0.88rem; margin-top: 6px;">You will be notified when your submissions are reviewed or receive community feedback.</p>
          </div>
        `;
        return;
      }

      let html = '';
      list.forEach(n => {
        let icon = '🔔';
        let badgeClass = 'chip-blue';
        if (n.type === 'approval') { icon = '🎉'; badgeClass = 'chip-green'; }
        if (n.type === 'like') { icon = '❤️'; badgeClass = 'chip-danger'; }
        if (n.type === 'comment') { icon = '💬'; badgeClass = 'chip-blue'; }
        if (n.type === 'exhibition') { icon = '🏛'; badgeClass = 'chip-green'; }
        if (n.type === 'follow') { icon = '👤'; badgeClass = 'chip-blue'; }

        html += `
          <div style="display: flex; align-items: flex-start; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--border-color); background: ${n.is_read == 0 ? 'var(--nsbm-green-subtle)' : '#fff'}; transition: background 0.15s;">
            <div style="font-size: 1.5rem; line-height: 1; padding-top: 2px;">${icon}</div>
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px;">
                <div style="font-weight: 700; color: var(--nsbm-blue); font-size: 0.98rem;">
                  ${n.title}
                  ${n.is_read == 0 ? '<span style="display: inline-block; width: 8px; height: 8px; background: var(--nsbm-green); border-radius: 50%; margin-left: 6px;"></span>' : ''}
                </div>
                <span style="font-size: 0.75rem; color: var(--text-light);">${n.created_at}</span>
              </div>
              <p style="font-size: 0.88rem; color: var(--text-main); line-height: 1.5; margin-bottom: 10px;">
                ${n.message}
              </p>
              <div style="display: flex; gap: 12px; align-items: center;">
                ${n.link ? `<a href="${n.link}" class="btn btn-primary btn-sm" onclick="markRead(${n.id})">View Item &rarr;</a>` : ''}
                ${n.is_read == 0 ? `<button class="btn btn-outline btn-sm" onclick="markRead(${n.id})">Mark as Read</button>` : ''}
                <button style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem;" onclick="deleteNotif(${n.id})">Delete</button>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    async function markRead(id) {
      try {
        await fetch(`api/notifications.php?action=mark_read&id=${id}`, { method: 'POST' });
        loadNotifications();
        App.updateUnreadBadge();
      } catch (e) {}
    }

    async function markAllRead() {
      try {
        await fetch('api/notifications.php?action=mark_read', { method: 'POST' });
        App.showToast('All notifications marked as read.', 'success');
        loadNotifications();
        App.updateUnreadBadge();
      } catch (e) {}
    }

    async function deleteNotif(id) {
      try {
        await fetch(`api/notifications.php?action=delete&id=${id}`, { method: 'POST' });
        loadNotifications();
        App.updateUnreadBadge();
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await App.checkAuth();
      const user = App.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      loadNotifications();
    });
  </script>
</body>
</html>
